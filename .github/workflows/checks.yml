name: Frontend checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.reklam.biz/api
          NEXT_PUBLIC_SITE_URL: https://reklam.biz
          NEXT_PUBLIC_INDEXABLE: 'true'
          NEXT_PUBLIC_LOCAL_TEST_LOGIN: 'false'
